{{/* Compact card grid for briefings. Three columns on desktop, two on tablet, one on phone. */}}
<style>
  .briefings { width: 100%; max-width: 72rem; margin: 0 auto; padding: 0 1rem; }
  .briefings__month { margin: 2.25rem 0 .875rem; padding-bottom: .375rem; font-size: 1.125rem; font-weight: 600; line-height: 1.4; border-bottom: 1px solid rgba(127,127,127,.3); }
  .briefings__grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  @media (min-width: 640px) { .briefings__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1024px) { .briefings__grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .briefing-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(127,127,127,.3); border-radius: .625rem; transition: border-color .15s, box-shadow .15s; }
  .briefing-card:hover, .briefing-card:focus-within { border-color: rgba(127,127,127,.7); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .briefing-card__image { position: relative; display: block; aspect-ratio: 3 / 1; background: rgba(127,127,127,.15); }
  .briefing-card__image img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
  .briefing-card__body { display: flex; flex-direction: column; gap: .375rem; padding: .75rem .875rem .875rem; }
  .briefing-card__date { font-size: .75rem; opacity: .7; }
  .briefing-card__title { margin: 0; font-size: .9375rem; font-weight: 600; line-height: 1.35; }
  .briefing-card__title a:hover { text-decoration: underline; }
  @media (max-width: 639px) {
    .briefing-card { flex-direction: row; }
    .briefing-card__image { flex: 0 0 5.5rem; aspect-ratio: auto; }
    .briefing-card__body { padding: .625rem .75rem; gap: .25rem; min-width: 0; }
    .briefing-card__summary { -webkit-line-clamp: 2 !important; }
  }
  .briefing-card__summary { margin: 0; font-size: .8125rem; line-height: 1.45; opacity: .85; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
</style>
<div class="briefings">
{{ if not .config.grouped }}<div class="briefings__grid">{{ end }}
